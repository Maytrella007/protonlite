[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protonlite"
version = "0.1.0"
description = "A small, unofficial Python client for Proton Mail, Calendar, Contacts and Drive -- no Bridge, no paid plan"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "William Wilamo" }]
keywords = ["proton", "protonmail", "proton-drive", "proton-calendar", "email", "openpgp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "PGPy13>=0.6.1rc1,<0.7",
    "bcrypt>=4.0,<6",
    "requests>=2.28,<3",
]

[project.optional-dependencies]
# The MCP server that exposes protonlite to MCP clients (Cursor, Claude Code,
# Claude Desktop). Installed with: pip install "protonlite[mcp]"
mcp = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/Maytrella007/protonlite"
Issues = "https://github.com/Maytrella007/protonlite/issues"

[project.scripts]
protonlite = "protonlite.cli:main"
protonlite-mcp = "protonlite_mcp.server:main"

[tool.setuptools]
packages = ["protonlite", "protonlite_mcp"]
